# Production stack cho VPS tự quản (D7).
#
# QUY TẮC SỐ MỘT: chỉ `nginx` có `ports:`.
#
# Docker chèn rule thẳng vào chain DOCKER của iptables và ĐI VÒNG QUA chính sách
# deny của ufw. Đây là lỗi kinh điển của VPS tự quản: `ufw status` báo chặn
# trong khi cổng vẫn mở ra Internet. Hệ quả cụ thể nếu publish nhầm:
#   - Redis không mật khẩu -> đọc được payload job, TIÊM được job tùy ý vào hàng
#     đợi mà worker sẽ ngoan ngoãn chạy, và flush được cache/session.
#   - Postgres mở -> lộ bảng `users` (email, hash mật khẩu) và
#     `personal_access_tokens`.
#
# Kiểm chứng bằng một lần QUÉT CỔNG TỪ NGOÀI, không phải bằng niềm tin vào ufw.

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Service DUY NHẤT chạm Internet.
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      # FE build ra đây; cùng origin với API (D12) nên không có CORS ở production.
      - frontend-dist:/var/www/html/frontend:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - app
    networks: [edge, internal]

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Thử gia hạn mỗi 12 tiếng; certbot tự bỏ qua khi chưa tới hạn.
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    networks: [edge]

  app:
    image: hanora-api:latest
    restart: unless-stopped
    env_file: [.env.production]
    volumes:
      - storage-data:/var/www/html/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    # KHÔNG có `ports:` — chỉ nginx gọi tới qua internal network.
    networks: [internal]

  worker:
    image: hanora-api:latest
    restart: unless-stopped
    env_file: [.env.production]
    volumes:
      - storage-data:/var/www/html/storage
    # Sau V1 hàng đợi chỉ còn phục vụ mail đặt lại mật khẩu — MỘT worker, một
    # hàng đợi mặc định. Không tách hàng đợi cho một loại job duy nhất.
    command: php artisan queue:work --tries=3 --max-time=3600 --sleep=3
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [internal]

  scheduler:
    image: hanora-api:latest
    restart: unless-stopped
    env_file: [.env.production]
    volumes:
      - storage-data:/var/www/html/storage
    # Chạy `sanctum:prune-expired` hằng ngày (routes/console.php). Không có
    # scheduler thì token hết hạn nằm lại bảng vĩnh viễn.
    command: php artisan schedule:work
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: [.env.production.db]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/backup.sh:/usr/local/bin/backup.sh:ro
      - postgres-backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: [.env.production.db]
    # `requirepass` BẬT kể cả khi redis không lộ ra ngoài — phòng tuyến thứ hai
    # cho trường hợp một service khác trong stack bị chiếm.
    command: ['sh', '-c', 'redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    volumes:
      - redis-data:/data
    networks: [internal]

networks:
  # `edge` chạm Internet; `internal` không có route ra ngoài.
  edge:
  internal:
    internal: true

volumes:
  postgres-data:
  postgres-backups:
  redis-data:
  storage-data:
  frontend-dist:
  letsencrypt:
  certbot-webroot:
