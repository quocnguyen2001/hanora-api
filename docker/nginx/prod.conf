# nginx production: phục vụ FE tĩnh + proxy /api, CÙNG MỘT ORIGIN (D12).
#
# Cùng origin nên KHÔNG có cấu hình CORS nào ở đây, và đó là một đơn giản hóa
# thật chứ không phải tiết kiệm một dịch vụ hosting.

server_tokens off;

gzip on;
gzip_vary on;
gzip_min_length 512;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

# HTTP: chỉ để certbot xác thực và chuyển hướng phần còn lại sang HTTPS.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/hanora/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hanora/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    root /var/www/html/frontend;
    index index.html;
    charset utf-8;
    client_max_body_size 2m;

    # ---- Security headers ----

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP — đây là thứ DUY NHẤT thực thi được kỷ luật render mà P9 dựa vào để
    # chấp nhận lưu token trong `localStorage`. Bỏ dòng này thì cơ sở của quyết
    # định đó không còn, và phải quay lại bàn về nơi lưu token.
    #
    # `script-src 'self'` — không inline, không eval, không CDN.
    # `style-src` phải có `'unsafe-inline'`: Tailwind v4 và Motion đặt style
    # inline lúc chạy. Style inline không thực thi mã, nên đánh đổi này hẹp hơn
    # hẳn so với script inline.
    # `connect-src 'self'` đủ vì FE và API cùng origin (D12).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ---- API ----

    location /api {
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/index\.php$ {
        # Chặn thực thi script qua PATH_INFO.
        try_files $uri =404;

        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTPS on;
        include fastcgi_params;
    }

    # ---- Frontend tĩnh ----

    # Asset có hash trong tên: bất biến, cache vĩnh viễn. Không có CDN nên
    # header này là thứ duy nhất giữ cho lần tải thứ hai nhanh.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker và manifest KHÔNG được cache lâu: chúng là cơ chế cập nhật.
    # Cache chúng nghĩa là người dùng kẹt ở bản cũ đúng bằng thời gian cache.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location / {
        # SPA fallback. `index.html` no-cache để bản deploy mới tới được ngay.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
