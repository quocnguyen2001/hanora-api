server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20m;

    # Không quảng cáo phiên bản nginx trong header và trang lỗi.
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Chặn thực thi script qua PATH_INFO: không có `try_files` ở đây thì
        # /uploads/anh.png/x.php sẽ được đẩy sang PHP-FPM.
        try_files $uri =404;

        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
